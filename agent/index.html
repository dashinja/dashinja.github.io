<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Byron's Agent</title>
    <meta http-equiv="refresh" content="4; url=https://agent.dashinja.com/" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background: #1a1a2e;
        color: #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: #16213e;
        border: 1px solid #2c3e6b;
        border-radius: 12px;
        padding: 2.5rem;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }
      h1 {
        color: #7eb8ff;
        font-size: 1.6rem;
        margin-bottom: 0.75rem;
      }
      p {
        color: #a8b3c5;
        margin-bottom: 1.25rem;
      }
      a.btn {
        background: #2c6bed;
        border: none;
        color: #fff;
        padding: 0.65rem 1.6rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      a.btn:hover {
        background: #4a83f0;
        color: #fff;
      }
      .countdown {
        font-size: 0.8rem;
        color: #6b7a93;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Byron's Personal Agent</h1>
      <p>
        The agenticMe control deck — chat, goals, runs, and approvals —
        lives at <strong>agent.dashinja.com</strong>.
      </p>
      <a class="btn" href="https://agent.dashinja.com/">Open the Agent</a>
      <p class="countdown">Redirecting in a few seconds…</p>
    </div>
  </body>
</html>
