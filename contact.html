      <h1 class="page-heading">Let's Connect</h1>
      <p class="page-lede">Drop a note and I'll get back to you.</p>

      <section class="contact-panel" aria-label="Contact form">
        <form action="#" method="post">
          <div class="form-field">
            <label for="name-input">Name</label>
            <input type="text" id="name-input" name="name" placeholder="John Smith" autocomplete="name" />
          </div>

          <div class="form-field">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" name="email" placeholder="example@domain.com" autocomplete="email" />
          </div>

          <div class="form-field">
            <label for="msg-input">Message</label>
            <textarea id="msg-input" name="message" rows="5" placeholder="What's on your mind?"></textarea>
          </div>

          <button class="btn-ember" type="submit">Send message</button>
        </form>

        <p class="contact-alt">
          Prefer social? Find me on
          <a href="https://www.linkedin.com/in/millerbyron/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          or
          <a href="https://github.com/dashinja" target="_blank" rel="noopener noreferrer">GitHub</a>.
